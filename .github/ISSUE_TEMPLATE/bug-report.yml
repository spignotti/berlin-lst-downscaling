name: Bug report
description: Report something that does not work as described
title: "bug: "
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the failure. Include the exact command, step, or component that triggered it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: The shortest sequence that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. Observe ...
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, Hydra config name, and relevant tool versions (uv, ruff, pyright).
      placeholder: "e.g. Python 3.12, macOS, uv 0.x, smoke-primary config"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — logs, screenshots, related issues, pipeline stage, dataset details.
    validations:
      required: false
