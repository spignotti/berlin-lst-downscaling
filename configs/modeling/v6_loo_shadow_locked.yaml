# @package _global_
# v6 ablation arm LOO-S: leave-one-out: L4 without shadows.
# C=20, loss masked_l1. Channels are listed in v6 registry order.
# Parameters: seed and trainer.max_epochs (see _v6_ablation_base.yaml).
defaults:
  - _v6_ablation_base
  - _self_

ablation_arm: "LOO-S"

contract:
  loss: "masked_l1"
  feature_order: "v6_named_subset"

data:
  n_active_channels: 20
  active_channel_names:
    - B02
    - B03
    - B04
    - B08
    - B11
    - B12
    - ndvi
    - ndwi_mcfeeters
    - ndbi
    - s2_broadband_albedo
    - building_height_mean
    - building_coverage_ratio
    - vegetation_height_mean
    - canopy_cover_fraction
    - imperviousness
    - svf
    - t2m_scene
    - ssrd_scene
    - wind_speed_10m_scene
    - tp_0_72h
  cache_max_bytes: 25769803776    # >= 12 GiB * 20/10

output_root: "data/runs/modeling-ablation-v6-loo-shadow/seed-${seed}"
