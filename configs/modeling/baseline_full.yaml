# @package _global_
# Naive prior-expand baseline, full run: every indexed patch of the requested
# splits. Explicit, expensive invocation — not run by CI.
#
# The output root is local to the machine that runs it. Do not point it at a
# canonical release or retained QA root; a baseline artifact is a run output.
defaults:
  - _base
  - _self_

splits: ["train", "validation", "test"]
max_patches_per_split: null   # unbounded: every indexed patch of the split
scene_ids: []

output_root: "data/runs/baseline-real"

patch_index_root: "gs://berlin-lst-data/training/patch-index/v1"
training_root: "gs://berlin-lst-data/training/v1"
ard_root: "gs://berlin-lst-data/ard/full/2017-2026-cutoff-20260717T235959Z"
