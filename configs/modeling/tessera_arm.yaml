# @package _global_
# TESSERA seed arm on the v6 training lock. Same scenes, split, loss and
# U-Net as L4. The loader keeps the 14 non-morphology, non-shadow channels
# and reads the per-scene-year embedding from tessera_embeddings_root.
# 2026 is excluded. features/v6 and the nine v6 arms are untouched.
# Test 2025 is scored only when evaluate_test stays true; seed runs pass
# evaluate_test=false.
defaults:
  - _v6_ablation_base
  - _self_

ablation_arm: null

contract:
  loss: "masked_l1"
  feature_order: "v6_registry"

data:
  n_active_channels: 22
  active_channel_names:
    - B02
    - B03
    - B04
    - B08
    - B11
    - B12
    - ndvi
    - ndwi_mcfeeters
    - ndbi
    - s2_broadband_albedo
    - building_height_mean
    - building_coverage_ratio
    - vegetation_height_mean
    - canopy_cover_fraction
    - imperviousness
    - svf
    - t2m_scene
    - ssrd_scene
    - wind_speed_10m_scene
    - tp_0_72h
    - shadow_building
    - shadow_vegetation
  cache_max_bytes: 42949672960    # 40 GiB: features plus original int8 embeddings and scales
  tessera_enabled: true
  tessera_embeddings_root: "gs://berlin-lst-training-data/embeddings/tessera/v1.1-dclimate"
  tessera_quality_threshold: 0.0

model:
  tessera_adapter_width: 8
  tessera_n_channels: 128

output_root: "data/runs/modeling-tessera-arm/seed-${seed}"
