# random_forest_v6_smoke subset scored on validation 2024 only. The test split
# (2025) is never requested or read.
defaults:
  - random_forest_v6_smoke
  - _self_

splits: ["validation"]           # val-only: test 2025 stays closed

output_root: "data/smoke/random-forest-v6-notest"
