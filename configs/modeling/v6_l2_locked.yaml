# @package _global_
# v6 ablation arm L2: L1 + morphology (ladder rung 2).
# C=16, loss masked_l1. Channels are listed in v6 registry order.
# Parameters: seed and trainer.max_epochs (see _v6_ablation_base.yaml).
defaults:
  - _v6_ablation_base
  - _self_

ablation_arm: "L2"

contract:
  loss: "masked_l1"
  feature_order: "v6_named_subset"

data:
  n_active_channels: 16
  active_channel_names:
    - B02
    - B03
    - B04
    - B08
    - B11
    - B12
    - ndvi
    - ndwi_mcfeeters
    - ndbi
    - s2_broadband_albedo
    - building_height_mean
    - building_coverage_ratio
    - vegetation_height_mean
    - canopy_cover_fraction
    - imperviousness
    - svf
  cache_max_bytes: 20615843021    # >= 12 GiB * 16/10

output_root: "data/runs/modeling-ablation-v6-l2/seed-${seed}"
