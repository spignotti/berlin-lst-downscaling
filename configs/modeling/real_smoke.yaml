# @package _global_
# Real-path smoke: a bounded, deterministic subset of the published WB3 patch
# index through the contract-conforming lifecycle — W&B offline, local
# ephemeral output under data/smoke/modeling-real.
#
# Requires ADC for the read-only GCS sources. It reads only published,
# immutable artifacts and writes nothing to GCS.
defaults:
  - _base
  - _self_

data:
  kind: real
  batch_size: 2
  max_batches_per_split: 2   # 4 patches per split: a bounded single pass

model:
  depth: 4                   # 160 px / 2**4 = 10 px bottleneck

trainer:
  max_epochs: 1

output_root: "data/smoke/modeling-real"

wandb:
  mode: "offline"

patch_index_root: "gs://berlin-lst-data/training/patch-index/v1"
training_root: "gs://berlin-lst-data/training/v1"
ard_root: "gs://berlin-lst-data/ard/full/2017-2026-cutoff-20260717T235959Z"
