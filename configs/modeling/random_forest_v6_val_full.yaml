# @package _global_
# Random-forest v6 residual baseline, validation-only full run: train-fit plus
# validation 2024 scoring. The test split (2025) is never requested, so no
# test patch ref is loaded and no test patch is read. Every other constant is
# inherited from random_forest_v6_full. Use this variant until the v6
# ablation matrix is frozen; the run name and report scope carry "notest".
defaults:
  - random_forest_v6_full
  - _self_

splits: ["validation"]           # val-only: test 2025 stays closed

output_root: "data/runs/random-forest-v6-notest"
