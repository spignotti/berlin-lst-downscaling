# @package _global_
# Tag-11 ablation stage 3 (issue #57): stage 2 + building/vegetation shadows.
# Shadows sit after ERA5 in the published V3 order, so this stage uses a named
# non-prefix subset (morphology before meteorology). Scaler stats stay the
# full train-only V3 fit; selection happens after scaling.
defaults:
  - real_full
  - _self_

ablation_lock: true
ablation_stage: 3
stage1_residual_prior: true

contract:
  loss: "masked_l1"
  feature_order: "v3_named_subset"

data:
  n_active_channels: 20
  active_channel_names:
    - B02
    - B03
    - B04
    - B08
    - B11
    - B12
    - ndvi
    - ndwi_mcfeeters
    - ndbi
    - s2_broadband_albedo
    - building_height_mean
    - building_height_std
    - building_coverage_ratio
    - building_height_max
    - vegetation_height_mean
    - vegetation_height_max
    - imperviousness
    - svf
    - shadow_building
    - shadow_vegetation
  splits: ["train", "validation"]
  batch_size: 4
  mode: stream
  num_workers: 0
  shuffle_train: true
  pin_memory: false
  cache_max_bytes: 25769803776    # >= 12 GiB * 20/10

trainer:
  accelerator: "gpu"
  devices: 1
  precision: "16-mixed"

output_root: "data/runs/modeling-ablation-stage3"

wandb:
  mode: "online"
