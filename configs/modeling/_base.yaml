# @package _global_
# Shared base config for the WB3 modeling scaffold. ``data.kind`` selects the
# lifecycle: ``synthetic`` (the deterministic all-valid MSE fixture),
# ``synthetic_contract`` (the GCS-free contract-shaped fixture), or ``real``
# (the contract-conforming path reading the published WB3 patch index). The
# base defaults to ``synthetic``; the other configs override it.
defaults:
  - _self_

# ── frozen Stage-1 contract invariants ────────────────────────────────
# Declared here so every resolved config shows the geometry, split, loss, and
# feature order it is bound to. These are NOT free parameters: ``run.py``
# asserts them against the contract constants and fails closed on drift.
contract:
  split: "temporal"            # 2017-2023 train / 2024 val / 2025 test (frozen)
  patch_px: 160                # 10 m prediction extent (frozen)
  patch_cells: 16              # 100 m supervision extent (frozen)
  loss: "masked_l1"            # Stage-1 loss (frozen)
  feature_order: "v3_first_c"  # first-C of the fixed V3 28-channel order

# Canonical data-release identifier this scaffold is wired to consume
# (immutable WB2c-4 training-data release; features on the V3 28-channel
# interface). No real data is read by the synthetic path.
data_release_id: "training/v1"
features_root: "gs://berlin-lst-data/features/v3"

# ── published roots for the real path (data.kind=real) ────────────────
# Required only by the real lifecycle; the synthetic path never reads them.
patch_index_root: null
training_root: null
ard_root: null

# Determinism: fixed seed + deterministic kernels. Recorded at run level;
# byte identity is still environment/hardware/library dependent.
seed: 0

# ── data ──────────────────────────────────────────────────────────────
data:
  kind: synthetic         # synthetic | synthetic_contract | real
  n_active_channels: 28   # first-C of the fixed V3 28-channel order
  batch_size: 8
  patch_size: 32          # synthetic only; H == W, divisible by 2 ** model.depth
  n_train: 128            # synthetic only
  n_val: 32               # synthetic only
  n_test: 32              # synthetic only
  max_patches_per_split: null  # real only; null = unbounded (full run)
  scene_ids: []           # real only; empty = all published scenes

# ── model (fixed deterministic 2D U-Net) ──────────────────────────────
model:
  base_width: 32
  depth: 3

# ── training ──────────────────────────────────────────────────────────
trainer:
  max_epochs: 5
  learning_rate: 1.0e-3
  weight_decay: 0.0
  accelerator: "auto"     # cpu | gpu | mps | auto
  devices: "auto"         # auto, an int, or a device list

# ── output ────────────────────────────────────────────────────────────
# Local output root (smoke: data/smoke/modeling). GCS output is out of
# scope for this scaffold; the VM/Vertex execution path is a later task.
output_root: "data/runs/modeling"

# ── W&B ───────────────────────────────────────────────────────────────
# mode "offline" writes local run records (no credentials, no network);
# mode "online" requires a valid W&B login and syncs to the project.
wandb:
  project: "berlin-lst-downscaling"
  mode: "online"

logging_level: INFO

# Hydra overrides (suppress run dir and cwd changes) — mirrors the other
# pipeline runners.
hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false