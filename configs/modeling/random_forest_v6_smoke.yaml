# @package _global_
# WARNING: this config OPENS TEST 2025 (splits validation + test). Do not run it
# before the v6 ablation matrix is frozen; use random_forest_v6_val_smoke instead.
# Random-forest v6 residual baseline smoke (v3 data chain, feature schema 5): a bounded, deterministic subset of
# the published patch index with deliberately small trees. Every method
# constant (criterion, bootstrap, max_features, min_samples_leaf, seed) is
# inherited from random_forest_v6_full; only resources and patch bounds are
# shrunk, so the smoke exercises the same code path at a fraction of the cost.
#
# Requires ADC for the read-only GCS sources; writes only local ephemeral
# output under data/smoke/random-forest-v6.
defaults:
  - random_forest_v6_full
  - _self_

profile: smoke

max_cells: 4096
max_train_patches: 3             # first indexed train rows: a bounded pool pass
max_patches_per_split: 2         # first indexed rows per eval split
probe_patches_per_split: 2

forest:
  n_estimators: 16
  max_depth: 10
  n_jobs: 1

output_root: "data/smoke/random-forest-v6"
