# @package _global_
# v6 ablation arm L5: L4 inputs with the thermal-aware loss (ladder rung 5).
# C=22, loss thermal_aware. Channels are listed in v6 registry order.
# Parameters: seed and trainer.max_epochs (see _v6_ablation_base.yaml).
defaults:
  - _v6_ablation_base
  - _self_

ablation_arm: "L5"

contract:
  loss: "thermal_aware"
  feature_order: "v6_registry"

data:
  n_active_channels: 22
  active_channel_names:
    - B02
    - B03
    - B04
    - B08
    - B11
    - B12
    - ndvi
    - ndwi_mcfeeters
    - ndbi
    - s2_broadband_albedo
    - building_height_mean
    - building_coverage_ratio
    - vegetation_height_mean
    - canopy_cover_fraction
    - imperviousness
    - svf
    - t2m_scene
    - ssrd_scene
    - wind_speed_10m_scene
    - tp_0_72h
    - shadow_building
    - shadow_vegetation
  cache_max_bytes: 28346784154    # >= 12 GiB * 22/10

output_root: "data/runs/modeling-ablation-v6-l5/seed-${seed}"
