# @package _global_
# Naive prior-expand baseline smoke: a bounded, deterministic subset of the
# published WB3 patch index, scored with the shared pooling and metrics.
#
# The subset selection matches configs/modeling/real_smoke.yaml (the first
# patches of each split in index order), so the model smoke and this baseline
# smoke cover identical patch IDs — that equality is what `nox -s
# smoke-real-comparison` asserts.
#
# Requires ADC for the read-only GCS sources; writes only local ephemeral
# output under data/smoke/baseline-real.
defaults:
  - _base
  - _self_

splits: ["train", "validation", "test"]
max_patches_per_split: 4
scene_ids: []

output_root: "data/smoke/baseline-real"

patch_index_root: "gs://berlin-lst-training-data/training/patch-index/v1"
training_root: "gs://berlin-lst-training-data/training/v1"
ard_root: "gs://berlin-lst-training-data/ard/full/2017-2026-cutoff-20260717T235959Z"
