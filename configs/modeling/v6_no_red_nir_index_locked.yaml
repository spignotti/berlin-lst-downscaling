# @package _global_
# v6 ablation arm NO-RED-NIR-IDX: input ablation: L4 without B04, B08 and the red/NIR-derived
# indices (ndvi, ndwi_mcfeeters, ndbi, s2_broadband_albedo).
# C=16, loss masked_l1. Channels are listed in v6 registry order.
# Parameters: seed and trainer.max_epochs (see _v6_ablation_base.yaml).
defaults:
  - _v6_ablation_base
  - _self_

ablation_arm: "NO-RED-NIR-IDX"

contract:
  loss: "masked_l1"
  feature_order: "v6_named_subset"

data:
  n_active_channels: 16
  active_channel_names:
    - B02
    - B03
    - B11
    - B12
    - building_height_mean
    - building_coverage_ratio
    - vegetation_height_mean
    - canopy_cover_fraction
    - imperviousness
    - svf
    - t2m_scene
    - ssrd_scene
    - wind_speed_10m_scene
    - tp_0_72h
    - shadow_building
    - shadow_vegetation
  cache_max_bytes: 20615843021    # >= 12 GiB * 16/10

output_root: "data/runs/modeling-ablation-v6-no-red-nir-index/seed-${seed}"
