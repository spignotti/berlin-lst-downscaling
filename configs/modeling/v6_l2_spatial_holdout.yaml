# @package _global_
# Spatial holdout add-on test, arm L2 (docs/spatial-holdout.md, pm #553).
# Everything is inherited from v6_l2_locked; only the option below and the
# output root differ. The option removes the held-out anchors of the
# committed assignment from the train split, refits the scaler on the
# remaining train patches, and selects the checkpoint on the validation
# patches of the other anchors.
# Parameters: seed and trainer.max_epochs, as for v6_l2_locked. A run must
# pass evaluate_test=false (launcher: --skip-test); the guard refuses a
# holdout run that would score test 2025.
defaults:
  - v6_l2_locked
  - _self_

spatial_holdout:
  enabled: true
  assignment: "v1"            # configs/modeling/spatial_holdout/v1.json

output_root: "data/runs/modeling-spatial-holdout-v6-l2/seed-${seed}"
