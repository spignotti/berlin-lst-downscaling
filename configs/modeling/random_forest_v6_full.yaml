# @package _global_
# WARNING: this config OPENS TEST 2025 (splits validation + test). Do not run it
# before the v6 ablation matrix is frozen; use random_forest_v6_val_full instead.
# RF v6: one forest per v6 ladder set L1-L4 (10 / 16 / 18 / 22 channels) from the v6
# arm registry, on the v3 data chain (training/v3, features/v6, feature schema 5).
# Protocol constants are identical to random_forest_full.yaml.
# Random-forest residual baseline, full run: one forest per v6 ladder
# feature set (10 / 16 / 18 / 22 channels), all four fitted on
# the same seeded reservoir of at most 500k eligible train cells, evaluated
# over the complete published validation and test splits.
#
# The frozen protocol: 200 trees, max_depth=20, min_samples_leaf=5,
# max_features=1.0, bootstrap, squared_error, seed 0. Only the smoke profile
# shrinks tree count/depth and parallelism; no method constant is tuned.
#
# Explicit, expensive invocation — not run by CI. The output root is local to
# the machine that runs it (the VM launcher passes data/runs/random-forest/<id>);
# do not point it at a canonical release or retained QA root.
defaults:
  - _base
  - _self_

profile: full

splits: ["validation", "test"]   # evaluation only; train is the pool, never scored
stages: [1, 2, 3, 4]             # cumulative v6 ladder sets L1-L4

seed: 0                          # reservoir draw and every forest's random_state
max_cells: 500000                # reservoir cap over the index-ordered train cells
max_train_patches: null          # null = every published train patch
max_patches_per_split: null      # null = every published patch of the split
probe_patches_per_split: 1       # per-split replay/pooling probes in the artifact

forest:
  n_estimators: 200
  max_depth: 20
  min_samples_leaf: 5
  max_features: 1.0
  bootstrap: true
  criterion: "squared_error"
  n_jobs: 2                      # bounded to the 2-vCPU CPU VM (launcher pins OMP=1)

wandb:
  mode: "offline"

output_root: "data/runs/random-forest-v6"

data_release_id: "training/v3"
features_root: "gs://berlin-lst-training-data/features/v6"
patch_index_root: "gs://berlin-lst-training-data/training/patch-index/v3"
training_root: "gs://berlin-lst-training-data/training/v3"
ard_root: "gs://berlin-lst-training-data/ard/full/2017-2026-s2-mosaic-v10"

data:
  feature_schema_version: 5      # features/v6, 22 channels
