# @package _global_
# Bounded Vertex GPU smoke for the cheap Stage-1 runtime: a few job-local
# cached real patches through the contract-conforming lifecycle on one GPU,
# 16-mixed, W&B online, local ephemeral output.
#
# This is a one-shot paid run. `modeling/run.py:assert_vertex_smoke_bounds`
# refuses to start if the resolved config drifts from these bounds (streamed
# real data, <= 4 refs per split, one epoch, one GPU, online W&B, local output
# root), and the guarded launcher enforces the same bounds before submitting.
# Checkpoints stay on the disposable worker disk; only a small metadata record
# is retained under the approved QA prefix.
#
# Operational knobs match the frozen full-run runtime from
# docs/stage1-efficiency.md (cache, workers 0, pin_memory false, 16-mixed)
# at smoke scale. Method choices stay out of this profile: C=10 here is only
# to exercise the same active-channel width as Stage 1, without the residual
# lock marker.
defaults:
  - _base
  - _self_

# Enables the fail-closed bounds check in the runner. Kept explicit so a direct
# invocation of this config is self-guarding, not only the guarded launcher.
vertex_smoke_bounds: true

data:
  kind: real
  n_active_channels: 10
  batch_size: 4
  max_patches_per_split: 4   # first 4 indexed rows per split: a bounded pass
  splits: ["train", "validation"]  # cache path admits train/validation only
  mode: stream               # admit via the stream reader, then build a job-local cache
  num_workers: 0
  shuffle_train: true        # seeded, deterministic train order
  pin_memory: false
  cache_root: null           # composed to <output_root>/cache when budget > 0
  cache_max_bytes: 268435456 # 256 MiB — plenty for eight C=10 patches

model:
  depth: 4                   # 160 px / 2**4 = 10 px bottleneck

trainer:
  max_epochs: 1
  accelerator: "gpu"
  devices: 1
  precision: "16-mixed"

# Local ephemeral output on the worker disk. The launcher overrides this with a
# unique job-scoped path; it must never point at a canonical or retained root.
output_root: "data/runs/vertex-smoke"

wandb:
  mode: "online"

patch_index_root: "gs://berlin-lst-training-data/training/patch-index/v1"
training_root: "gs://berlin-lst-training-data/training/v1"
ard_root: "gs://berlin-lst-training-data/ard/full/2017-2026-cutoff-20260717T235959Z"
