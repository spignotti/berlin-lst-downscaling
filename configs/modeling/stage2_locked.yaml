# @package _global_
# Tag-11 ablation stage 2 (issue #57): Stage-1 spectral block + morphology /
# surface geometry. Backbone, split, residual prior, seeds, and selection
# metric stay frozen as in stage1_locked. Channel set is the first 18 of the
# fixed V3 order (spectral + index + morphology).
defaults:
  - real_full
  - _self_

ablation_lock: true
ablation_stage: 2
stage1_residual_prior: true

contract:
  loss: "masked_l1"
  feature_order: "v3_first_c"

data:
  n_active_channels: 18
  active_channel_names:
    - B02
    - B03
    - B04
    - B08
    - B11
    - B12
    - ndvi
    - ndwi_mcfeeters
    - ndbi
    - s2_broadband_albedo
    - building_height_mean
    - building_height_std
    - building_coverage_ratio
    - building_height_max
    - vegetation_height_mean
    - vegetation_height_max
    - imperviousness
    - svf
  splits: ["train", "validation"]
  batch_size: 4
  mode: stream
  num_workers: 0
  shuffle_train: true
  pin_memory: false
  cache_max_bytes: 23192823398    # >= 12 GiB * 18/10

trainer:
  accelerator: "gpu"
  devices: 1
  precision: "16-mixed"

output_root: "data/runs/modeling-ablation-stage2"

wandb:
  mode: "online"
