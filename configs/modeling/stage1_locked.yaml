# @package _global_
# Stage-1 locked profile. This is the frozen experiment contract for the
# full Stage-1 model and its probes: it fixes the spectral block, backbone
# capacity, and optimisation defaults so later runs cannot silently drift.
#
# Frozen (do not tune in Stage 1):
#   data.n_active_channels: 10   first ten channels of the fixed V3 order —
#                                B02, B03, B04, B08, B11, B12, ndvi,
#                                ndwi_mcfeeters, ndbi, s2_broadband_albedo
#   model.depth: 4               U-Net depth (160 px / 2**4 = 10 px bottleneck)
#   model.base_width: 32
#   trainer.learning_rate: 1.0e-3
#   trainer.weight_decay: 0.0
#   seed: 0
#   augmentation: none           no augmentation code exists on this path; the
#                                default is none and Stage 1 keeps it
#   contract.*                   temporal split, 160/16 geometry, masked L1,
#                                v3_first_c order (inherited from _base)
# The separate lst_prior input is an additional channel, never counted in the
# ten feature channels.
#
#   stage1_residual_prior: true  The full Stage-1 method predicts a Kelvin
#                                correction added to the reconstructed prior,
#                                with a zero-initialized head. Proven by the
#                                bounded recovery probe (issue #47,
#                                docs/stage1-debug-results.md §6: GO, 1.1929 K val
#                                vs 1.5261 K same-cohort naive). The absolute
#                                representation is retired for Stage 1.
#
# Stage-1 operational retunes (allowed without reopening method choices):
# batch size, AMP precision, dataloader workers, early-stopping patience.
#
# `modeling/run.py:assert_stage1_lock` fails closed if any frozen value drifts
# from this profile before any source read or fit.
#
# Scope: full temporal train/validation over every published patch, W&B online.
# This is an explicit, expensive invocation — not run by CI. Do not point
# output_root at a canonical release or retained QA root.
#
# Isolation (issue #53): the fit reads train/validation only; the 2025 test
# split is scored once, after the selected checkpoint is frozen, by a separate
# test-only pass in the lifecycle. `assert_stage1_lock` and
# `assert_stage1_full_bounds` fail closed on any split, device, or scope drift
# before a run directory is created or a paid job starts.
defaults:
  - real_full
  - _self_

# Lock markers; the runner requires them when this profile is selected, so the
# guards cannot be disabled by overriding them away.
stage1_lock: true
stage1_full: true
stage1_residual_prior: true

data:
  n_active_channels: 10            # first 10 of the fixed V3 28-channel order
  splits: ["train", "validation"]  # the 2025 test split is scored once, after freeze
  # Frozen cheap runtime from docs/stage1-efficiency.md (J1–J4).
  # Operational retunes only; the frozen method above is unchanged.
  # cache_root stays null here: run.py composes <output_root>/cache so each
  # job keeps a job-local cache.
  batch_size: 4
  mode: stream
  num_workers: 0
  shuffle_train: true
  pin_memory: false
  cache_max_bytes: 12884901888    # 12 GiB fit-cache budget (8.64 GiB payload + headroom)

trainer:
  accelerator: "gpu"
  devices: 1
  precision: "16-mixed"           # candidate; cached FP32 is the preverified fallback

output_root: "data/runs/modeling-stage1-locked"

wandb:
  mode: "online"
