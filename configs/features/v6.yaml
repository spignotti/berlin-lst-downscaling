# @package _global_
# Feature release v6. One contract:
# - Sentinel-2 ARD v10 (recorded-member mosaics from the v4 selection
#   bundle) and the area-exact LoD2 derived/dynamic roots
# - the roster from feature_schema (schema version 5: canopy cover, slim ERA5)
# features/v5 stays on its published roots. publish_guard refuses
# features/v3, features/v4, and features/v5. This file does not publish.
#
# static/sources, static/derived, and dynamic use new prefixes. A run
# fails closed instead of mixing the published SVF and building shadows
# into this release. Do not write static/sources/imperviousness-v3.
# The stack reads harmonized ARD and does not apply a second S2 offset.
# S2 ARD v10 ledger is seeded with the published Landsat/ECOSTRESS rows
# (contracts unchanged: landsat-c2-l2 schema 7 area-mean native_bit_or,
# ecostress schema 7) by scripts/operators/seed_ard_v10_reuse.py during the
# step-2 VM run, before the mosaic run; see docs/republish-v6.md.
defaults:
  - _base
  - _self_

feature_schema_version: 5
# Provisional canopy threshold in metres. Part of the config hash.
canopy_cover_threshold_m: 2.5
# Loader switch. scene_value is the v6 default; bilinear is the ablation.
era5_representation: scene_value

manifest_uri: "gs://berlin-lst-training-data/manifests/v4/2017-2026-cutoff-20260717T235959Z/manifest.parquet"
ard_root: "gs://berlin-lst-training-data/ard/full/2017-2026-s2-mosaic-v10"
static_sources_root: "gs://berlin-lst-training-data/static/sources/lod2-area-exact-v2"
static_derived_root: "gs://berlin-lst-training-data/static/derived/lod2-area-exact-v2"
dynamic_root: "gs://berlin-lst-training-data/dynamic/lod2-area-exact-v2"
output_root: "gs://berlin-lst-training-data/features/v6"
scene_ids: []
bbox: null
