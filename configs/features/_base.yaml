# @package _global_
# Base config for the scene feature-stack pipeline.
# Reads published inputs (manifest, ledgers, ARD, static derived, dynamic,
# AOI) and writes per-anchor 24-band feature COGs + feature_valid masks
# under ``output_root/<scene_id>/`` plus a run report under
# ``output_root/qa/features/<run_id>/report.json``.
defaults:
  - _self_

manifest_uri: "gs://berlin-lst-data/manifests/v3/2017-2026-cutoff-20260717T235959Z-r2/manifest.parquet"
ard_root: "gs://berlin-lst-data/ard/full/2017-2026-cutoff-20260717T235959Z"
static_sources_root: "gs://berlin-lst-data/static/sources/full"
static_derived_root: "gs://berlin-lst-data/static/derived/full"
dynamic_root: "gs://berlin-lst-data/dynamic/full"
geometry_mapping_uri: "gs://berlin-lst-data/static/geometry_vintages/v1/geometry_mapping.json"

# Exact Berlin AOI mask (10 m, EPSG:25833). Reprojected onto the canonical
# grid with nearest resampling; pixels outside it are always invalid.
aoi_mask_uri: "data/boundaries/aoi_10m.tif"

# Canonical feature root (per-anchor stacks, ledger, run reports).
output_root: "gs://berlin-lst-data/features/v1"

# The one vegetation-height dataset (2020) is carried forward to every
# scene year via the 2024 geometry profile's vegetation_dsm product.
vegetation_carry_forward_vintage: 2024

# Full run: 324 assessable anchor scenes (2017-2025). Overridden by the
# smoke config, where scene_ids restrict the run and this check is skipped.
expected_scene_count: 324

# Optional smoke restriction (overridden by the smoke config).
scene_ids: []
bbox: null

logging_level: INFO

# Hydra overrides (suppress run dir and cwd changes).
hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false
