# @package _global_
# Training release v3. Reads feature release v6 (22-channel roster,
# canopy_cover_fraction, tp_0_72h log1p then z-score scaler) and the
# area-mean Landsat ARD rows seeded into the v10 ledger. training/v1 and
# training/v2 stay unchanged.
# Step 7 of docs/republish-v6.md: from configs/features/v6.yaml.
defaults:
  - _base
  - _self_

manifest_uri: "gs://berlin-lst-training-data/manifests/v4/2017-2026-cutoff-20260717T235959Z/manifest.parquet"
ard_root: "gs://berlin-lst-training-data/ard/full/2017-2026-s2-mosaic-v10"
static_sources_root: "gs://berlin-lst-training-data/static/sources/lod2-area-exact-v2"
static_derived_root: "gs://berlin-lst-training-data/static/derived/lod2-area-exact-v2"
dynamic_root: "gs://berlin-lst-training-data/dynamic/lod2-area-exact-v2"
geometry_mapping_uri: "gs://berlin-lst-training-data/static/geometry_vintages/v1/geometry_mapping.json"
features_root: "gs://berlin-lst-training-data/features/v6"
output_root: "gs://berlin-lst-training-data/training/v3"
