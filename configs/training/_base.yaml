# @package _global_
# Shared base config for the WB2c-4 training-data pipeline (eligibility
# masks, splits, scaler, index). Reads published Feature Release V3 inputs
# (manifest, ARD ledgers, features) and writes per-scene 100 m eligibility
# artifacts under ``output_root/<scene_id>/`` plus the top-level release
# artifacts (manifest, cells, scaler, complete marker).
defaults:
  - _self_

manifest_uri: "gs://berlin-lst-data/manifests/v3/2017-2026-cutoff-20260717T235959Z-r2/manifest.parquet"
ard_root: "gs://berlin-lst-data/ard/full/2017-2026-cutoff-20260717T235959Z"
static_sources_root: "gs://berlin-lst-data/static/sources/full"
static_derived_root: "gs://berlin-lst-data/static/derived/full"
dynamic_root: "gs://berlin-lst-data/dynamic/full"
geometry_mapping_uri: "gs://berlin-lst-data/static/geometry_vintages/v1/geometry_mapping.json"

# Canonical Feature Release V3 — the only permitted input basis (hard
# gate; V1/V2 are rejected).
features_root: "gs://berlin-lst-data/features/v3"

# Canonical training-data release root.
output_root: "gs://berlin-lst-data/training/v1"

# Full run: 324 assessable anchor scenes (2017-2025). Skipped when
# scene_ids restrict the run (smoke).
expected_scene_count: 324

# Optional smoke restriction (overridden by the smoke config).
scene_ids: []
bbox: null

logging_level: INFO

# Hydra overrides (suppress run dir and cwd changes).
hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false