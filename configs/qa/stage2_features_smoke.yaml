# @package _global_
# Smoke: the same four deterministic scenes (one per LoD vintage) on the
# bounded canonical-aligned bbox as the features smoke. Reads the
# published or locally-produced feature stacks; writes only local
# ephemeral output under data/smoke/qa-stage2/ (removed after the nox
# smoke session, never uploaded).
defaults:
  - _base
  - _self_

scene_ids:
  - "LC08_L2SP_193023_20170720_02_T1"  # 2017
  - "LC08_L2SP_192024_20210910_02_T1"  # 2021
  - "LC09_L2SP_193023_20220624_02_T1"  # 2022
  - "LC09_L2SP_193023_20240629_02_T1"  # 2024

# Bounded canonical-aligned subset inside the Berlin bbox (~1.45k x 1.06k
# 10m px). Matches configs/features/smoke.yaml.
bbox: [13.4602832, 52.4041766, 13.6691668, 52.4965573]

output_root: "data/smoke/qa-stage2"