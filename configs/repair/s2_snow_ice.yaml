# Targeted S2 snow/ice flag repair — one-off production maintenance.
#
# Repairs only the 75 audited S2 ARD scenes with SCL=11 (audit cbedd8db)
# by OR-ing FLAG_SNOW_ICE (bit 5) into the existing flag COGs. No ARD
# pipeline involvement, no reflectance COG changes, no ledger migration.

# Canonical v3 manifest bundle (pairings derived from it).
manifest_uri: "gs://berlin-lst-data/manifests/v3/2017-2026-cutoff-20260717T235959Z-r2/manifest.parquet"

# Published ARD ledger + root.
ard_ledger_uri: "gs://berlin-lst-data/ard/full/2017-2026-cutoff-20260717T235959Z/ledger.parquet"
ard_root: "gs://berlin-lst-data/ard/full/2017-2026-cutoff-20260717T235959Z"

# Pre-baked Berlin AOI mask (reprojected to the canonical grid at runtime).
aoi_mask_uri: "gs://berlin-lst-data/boundaries/aoi_10m.tif"

# Baseline snow/ice audit — the allowlist source.
audit_root: "gs://berlin-lst-data/qa/wb2c-2/raw/s2-snow-ice"
audit_run_id: "cbedd8db"

# Evidence prefix for backups, receipts, and post-audit output.
evidence_prefix: "gs://berlin-lst-data/qa/repairs"

# Source under repair.
source: "sentinel-2-l2a"

# Baseline aggregates from audit run cbedd8db (independent checks passed).
expected_scenes_total: 158
expected_scenes_with_scl11: 75
expected_scenes_with_unflagged: 70
expected_scl11_px: 2116536
expected_scl11_invalid_px: 1050876
expected_scl11_unflagged_px: 1065660

# Required pre-repair commits (ancestors of HEAD at apply time).
required_commits:
  - "99d6e3f"
  - "e1e6bb6"
  - "bc05928"
  - "b1adbde"

# Incident finalizer pinning (WB2c-2, one-off). Binds the finalizer to the
# exact failed apply and its dry-run receipt; the receipt is the only
# durable binding of backup -> pre-repair state (the failed apply never
# wrote its final receipt/summary).
finalize:
  repair_id: "s2-snow-ice-20260811T215612"
  dry_receipt_sha256: "384b5426c64d007bb23d9b7739ca2fb060796090f7b80a181439364c6b8b790d"
  expected_scenes_total: 158
  expected_scenes_with_scl11: 75
  expected_scl11_px: 2116536
  # Post-repair: every SCL11 pixel is flagged (== scl11_px). The pre-repair
  # expected_scl11_invalid_px above is the baseline, NOT the finalizer gate.
  expected_scl11_invalid_px: 2116536
  expected_scl11_unflagged_px: 0
