# @package _global_
# ARD v10 gap processing: Landsat/ECOSTRESS scenes from the v4 selection
# bundle without a verifiable reuse row (missing row, non-done row, or a
# done row whose referenced COG/flag is empty or missing, e.g. a stale
# gs://berlin-lst-data reference). Runs after seed_ard_v10_reuse.py and the
# S2-only mosaic pass in run-ard-v10-vm.sh, into the same v10 root.
# Reconcile processes exactly the gap scenes: seeded done rows (referenced
# COGs verified present) are skipped, so a rerun is a no-op. Contracts are
# unchanged (landsat-c2-l2 schema 7 area-mean lwir11 + native_bit_or QA,
# ecostress schema 7) with the same policy hash the seeder verifies, so
# gap products match the seeded rows' schema.
defaults:
  - _base
  - _self_

sources: ["landsat-c2-l2", "ecostress"]
mode: full
# v4 selection bundle (step 1 of docs/republish-v6.md).
manifest_uri: "gs://berlin-lst-training-data/manifests/v4/2017-2026-cutoff-20260717T235959Z/manifest.parquet"
output_root: "gs://berlin-lst-training-data/ard/full/2017-2026-s2-mosaic-v10"
