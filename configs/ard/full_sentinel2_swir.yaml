# @package _global_
# Full ARD run — Sentinel-2 only, six-band SWIR contract.
#
# Published schema-8 prefix. Do not re-run it after the schema-9 change:
# reconcile would overwrite this root. New reflectance goes to
# configs/ard/sentinel2_harmonized_v9.yaml. Landsat and ECOSTRESS rows
# keep their current version and are not touched by this config.
defaults:
  - _base
  - _self_

sources: ["sentinel-2-l2a"]
mode: full
manifest_uri: null            # provided by the VM wrapper (canonical r2 bundle)
output_root: "gs://berlin-lst-training-data/ard/full/2017-2026-cutoff-20260717T235959Z"
