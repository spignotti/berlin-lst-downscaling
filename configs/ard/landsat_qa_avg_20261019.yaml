# @package _global_
# Landsat-only ARD republish. lwir11 uses area mean; QA uses the native
# bit-OR. Sentinel-2 and ECOSTRESS rows are seeded from the previous QA
# ledger and are not reloaded. The previous root stays unchanged.
defaults:
  - _base
  - _self_

sources: ["landsat-c2-l2"]
mode: full
manifest_uri: "gs://berlin-lst-training-data/manifests/v3/2017-2026-cutoff-20260717T235959Z-r2/manifest.parquet"
output_root: "gs://berlin-lst-training-data/ard/full/2017-2026-qa-avg-20261019"
target_resolution_low: 100
target_resolution_high: 10
landsat_st_resampling: average
landsat_qa_aggregation: native_bit_or
