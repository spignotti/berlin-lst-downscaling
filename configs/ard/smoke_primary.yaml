# @package _global_
# Manifest-driven smoke test — all 3 sources, output to local tmp.
# Builds the full 8-row smoke bundle (1 Landsat + 1 S2 + 6 ECOSTRESS)
# then runs mode=full through it.
defaults:
  - _base
  - _self_

sources: ["landsat-c2-l2", "sentinel-2-l2a", "ecostress"]
mode: full
scene_date: null
output_root: "data/smoke/primary/ard"
