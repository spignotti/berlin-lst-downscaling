# @package _global_
# Recorded-member S2 mosaics: per-item BOA offsets and whole-pixel donors.
# Requires the v4 selection bundle; never rediscover members from a legacy row.
# Resume pins each scene's membership, group, processing policy, and AOI bytes
# in ledger.schema_hash. Changed or missing input contracts require a new root.
defaults:
  - _base
  - _self_

sources: ["sentinel-2-l2a"]
mode: full
# v4 selection bundle (step 1 of docs/republish-v6.md). The ledger in
# output_root is seeded with the published Landsat/ECOSTRESS rows from
# gs://berlin-lst-training-data/ard/full/2017-2026-qa-avg-20261019
# (contracts unchanged: landsat-c2-l2 schema 7, ecostress schema 7) before
# the mosaic run; S2 rows are fresh schema-10 mosaics. Manifest reuse keys
# without a verifiable row are gap-processed right after by
# configs/ard/landsat_ecostress_v10.yaml (same roots, current contracts).
manifest_uri: "gs://berlin-lst-training-data/manifests/v4/2017-2026-cutoff-20260717T235959Z/manifest.parquet"
output_root: "gs://berlin-lst-training-data/ard/full/2017-2026-s2-mosaic-v10"

sentinel2:
  schema_version: 10
  mosaic:
    enabled: true
    max_missing_aoi_fraction: 0.005
