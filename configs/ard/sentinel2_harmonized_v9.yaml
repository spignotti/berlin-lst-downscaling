# @package _global_
# Sentinel-2 ARD schema 9. Harmonizes BOA reflectance per scene from
# STAC metadata before the [0, 1] clip. Publish only to this new prefix.
#
# Do not point output_root at a published schema-8 root:
#   gs://berlin-lst-training-data/ard/full/2017-2026-cutoff-20260717T235959Z
#   gs://berlin-lst-training-data/ard/full/2017-2026-qa-avg-20261019
# Re-running those configs after the schema bump would reconcile and
# overwrite published COGs. features/v5 keeps reading the QA-average root.
defaults:
  - _base
  - _self_

sources: ["sentinel-2-l2a"]
mode: full
manifest_uri: null            # provided by the VM wrapper (canonical r2 bundle)
output_root: "gs://berlin-lst-training-data/ard/full/2017-2026-s2-harmonized-v9"
