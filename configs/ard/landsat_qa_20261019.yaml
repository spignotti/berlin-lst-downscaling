# @package _global_
# Landsat-only ARD republish with the hardened clear-pixel rule.
# Sentinel-2 and ECOSTRESS rows stay in the seeded ledger and keep their
# existing objects. Landsat rows are schema 6 in that ledger and schema 7
# in code, so reconcile reprocesses them into this new root.
defaults:
  - _base
  - _self_

sources: ["landsat-c2-l2"]
mode: full
manifest_uri: "gs://berlin-lst-training-data/manifests/v3/2017-2026-cutoff-20260717T235959Z-r2/manifest.parquet"
output_root: "gs://berlin-lst-training-data/ard/full/2017-2026-qa-20261019"
target_resolution_low: 100
target_resolution_high: 10
