# @package _global_
# Base config for WB2c-1 profiling.

# Manifest URI — REQUIRED. Published v3 manifest bundle.
manifest_uri: null

# Ledger URIs — REQUIRED. Published ledger paths.
ard_ledger_uri: null

# Data roots
dynamic_root: "gs://berlin-lst-data/dynamic/full"
inference_root: "gs://berlin-lst-data/dynamic/inference/2026"

# Output root — fixed path for overwrite semantics
output_root: "gs://berlin-lst-data/profiling/wb2c-1"

# Logging
logging_level: INFO

# Hydra overrides
hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false
