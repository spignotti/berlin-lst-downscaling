# @package _global_
# EDA v3 release inputs. The EDA runner is argparse-driven
# (scripts/operators/run_training_eda.py), not Hydra, so this file pins the
# exact roots the step-9 launcher passes as CLI flags. Outputs land in
# gs://berlin-lst-training-data/evaluation/eda/v3.
# Step 9 of docs/republish-v6.md. Denominators are the AOI-intersected
# eligibility rates from #89 (eligibility_rates.parquet weighted by the
# 100 m AOI fractions from --aoi-mask).
training_root: "gs://berlin-lst-training-data/training/v3"
features_root: "gs://berlin-lst-training-data/features/v6"
v3_manifest: "gs://berlin-lst-training-data/manifests/v4/2017-2026-cutoff-20260717T235959Z/manifest.parquet"
stadtstruktur_root: "gs://berlin-lst-training-data/evaluation/stadtstruktur/v1"
patch_index_root: "gs://berlin-lst-training-data/training/patch-index/v3"
aoi_mask: "data/boundaries/aoi_10m.tif"
upload_uri: "gs://berlin-lst-training-data/evaluation/eda/v3"
