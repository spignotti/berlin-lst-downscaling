# Matrix frozen by the owner: 9 arms x seeds 0, 1, 2 = 27 runs.
# LOO-ERA5 equals L3 and has no entry.
# Training schema (owner decision 2026-10-31), one value each for all 27 runs;
# per-arm entries must not carry these keys:
# - max_epochs: every run trains 40 epochs.
# - lr_schedule (constant | cosine): cosine with the v6 lock pins warmup_epochs=2
#   and eta_min=0.0, stepped per epoch, T_max = trainer.max_epochs.
# - early_stopping: off.
# - patch_cache (job_local | prebuilt): prebuilt caches are keyed by each arm's
#   data config and resolved at runtime; no key is stored here.
max_epochs: 40
lr_schedule: cosine
early_stopping: false
patch_cache: prebuilt
arms:
  L1: {seeds: [0, 1, 2]}
  L2: {seeds: [0, 1, 2]}
  L3: {seeds: [0, 1, 2]}
  L4: {seeds: [0, 1, 2]}
  L5: {seeds: [0, 1, 2]}
  LOO-M: {seeds: [0, 1, 2]}
  LOO-S: {seeds: [0, 1, 2]}
  NO-NDVI-NDWI: {seeds: [0, 1, 2]}
  NO-RED-NIR-IDX: {seeds: [0, 1, 2]}

# Planner-only estimates (scripts/validators/plan_v6_ablation.py); the Vertex
# launcher does not read them. Measured on the v6 L4 cosine confirmation run
# (Vertex custom job 3483894676707082240, 40 epochs, T4, europe-west3, job-local
# patch cache): ~159 s per epoch, ~2 h 23 min wall time for the whole job.
# Run hours = fixed overhead + max_epochs * hours per epoch.
hours_per_epoch_estimate: 0.045
# Includes provisioning and the job-local cache build (measured ~0.62 h; the
# rounded-up per-epoch value keeps the 2.4 h run estimate above the measured
# 2.38 h). Runs with a prebuilt cache should need less.
fixed_overhead_hours_estimate: 0.6
usd_per_hour: 1.00  # user-authorized Vertex cap, not a verified list price
