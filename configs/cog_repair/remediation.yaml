# COG Layout Remediation — immutable run configuration
#
# Source: 2026-08-03 incident — 1,407 overwritten COGs, 672 untouched hard-layout failures
# Purpose: safely capture originals, repair layout, and promote verified candidates
# Grain: one row per canonical COG URI; one immutable event per state transition
#
# This file is immutable once committed.  Its hash is embedded in every
# recovery event and report.

# Canonical asset roots
canonical_roots:
  ard_full: gs://berlin-lst-data/ard/full/2017-2026-cutoff-20260717T235959Z
  static_sources: gs://berlin-lst-data/static/sources/full
  static_derived: gs://berlin-lst-data/static/derived/full
  dynamic_full: gs://berlin-lst-data/dynamic/full
  dynamic_inference: gs://berlin-lst-data/dynamic/inference/2026

# Expected inventory count — must match exactly
expected_count: 2079

# Legacy repair artifacts (read-only reference)
legacy:
  audit_uri: gs://berlin-lst-data/_maintenance/cog-layout/20260803/audit.parquet
  state_uri: null

# Recovery bucket — dedicated regional store for backups, candidates, events
recovery_bucket: gs://berlin-lst-data-recovery
recovery_prefix: cog-layout-recovery/2026-08-03-remediation

# Legacy recovery root (read-only) — contains 2,079 payload backups from
# the initial backup run.  Used as source for baseline reconstruction and
# Cogger candidate generation.
legacy_recovery_root: gs://berlin-lst-data-recovery/cog-layout-recovery/2026-08-03

# Incident timeline (UTC)
incident:
  first_overwrite: "2026-08-03T14:19:03Z"
  audit_start: "2026-08-03T14:42:42Z"
  audit_end: "2026-08-03T16:03:16Z"
  last_overwrite: "2026-08-03T16:35:43Z"
  vm_stopped: "2026-08-03T17:40:16Z"

# Soft delete retention — hard-delete deadline is 7 days after each overwrite
soft_delete_retention_days: 7

# Classification routing (engine × cohort)
engines:
  cogger:
    description: "Airbus Cogger v0.1.1 — byte-reshuffle for tiled/compressed/overview-bearing inputs"
    binary_asset_hash: "79f6e9885cf11bcb7df00ec2246ea5bde633068bd4df164ed1f316723165a7a4"
    binary_asset_name: "cogger_0.1.1_linux_amd64.zip"
    release_url: "https://github.com/airbusgeo/cogger/releases/tag/v0.1.1"
    applicable_to: "approved IFD/offset hard-layout errors with tiled/compressed/overview-bearing source"
  gdal_cog:
    description: "GDAL COG driver via Rasterio — reencode with OVERVIEWS=AUTO for missing-overview flag COGs"
    overview_resampling: "NEAREST"
    blocksize: 512
    compress: "ZSTD"
    predictor: 1
    bigtiff: "IF_SAFER"
    applicable_to: "missing-overview-only flag COGs"
  none:
    description: "No repair needed — already strict-clean"
    applicable_to: "1,243 strict-valid assets"

# Promotion batch sizes
batch_sizes:
  - 1    # canary per engine
  - 10
  - 50
  - 100
