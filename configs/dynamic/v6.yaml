# @package _global_
# Dynamic products for features/v6. ERA5 is the four-channel roster with
# one scene scalar per channel. The published dynamic/full product stays
# the 8-band bilinear contract. The feature loader can also reduce an
# 8-band COG, so this republish is optional if compose applies the switch.
# Step 5 of docs/republish-v6.md: reads the v4 manifest and the v6 static
# roots, writes the new dynamic/lod2-area-exact-v2 prefix.
defaults:
  - full
  - _self_

years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
dataset_role: anchor
# The v4 bundle is the universe: selection v4's AOI-overlap gate drops edge
# anchors, so no fixed count is valid. Null skips the pipeline count gate
# (as for features/v6 and training/v3); the post-run validator derives the
# expected count from the bundle instead.
expected_scene_count: null
manifest_uri: "gs://berlin-lst-training-data/manifests/v4/2017-2026-cutoff-20260717T235959Z/manifest.parquet"
source_root: "gs://berlin-lst-training-data/static/sources/lod2-area-exact-v2"
derived_root: "gs://berlin-lst-training-data/static/derived/lod2-area-exact-v2"
geometry_mapping_uri: "gs://berlin-lst-training-data/static/geometry_vintages/v1/geometry_mapping.json"
era5_channel_set: v6
era5_representation: scene_value
aoi_mask_uri: "data/boundaries/aoi_10m.tif"
output_root: "gs://berlin-lst-training-data/dynamic/lod2-area-exact-v2"
