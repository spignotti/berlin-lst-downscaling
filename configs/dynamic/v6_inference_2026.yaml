# @package _global_
# Dynamic products for the 2026 inference scenes. Same v6 contract as
# configs/dynamic/v6.yaml (ERA5 scene_value, four-channel roster, v6
# shadows, published lod2-area-exact-v2 static roots). Years are 2026
# only and the ledger role is inference. Do not use
# configs/dynamic/inference_2026.yaml: that file is the legacy v3 contract.
defaults:
  - v6
  - _self_

years: [2026]
dataset_role: inference
# The new bundle is the universe. Null skips the pipeline count gate;
# the post-run validator derives the count with --include-inference-scenes.
expected_scene_count: null
manifest_uri: "gs://berlin-lst-training-data/manifests/v4-inference/2026-cutoff-20260930T235959Z/manifest.parquet"
source_root: "gs://berlin-lst-training-data/static/sources/lod2-area-exact-v2"
derived_root: "gs://berlin-lst-training-data/static/derived/lod2-area-exact-v2"
geometry_mapping_uri: "gs://berlin-lst-training-data/static/geometry_vintages/v1/geometry_mapping.json"
era5_channel_set: v6
era5_representation: scene_value
aoi_mask_uri: "data/boundaries/aoi_10m.tif"
output_root: "gs://berlin-lst-training-data/dynamic/inference/2026-v6"
